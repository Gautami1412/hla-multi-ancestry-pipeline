# =========================================================================
# HLA Multi-Ancestry Variant Calling Pipeline — main config
# Edit this file, not the Snakefile, to change samples / paths / thresholds.
# =========================================================================

# ---- Region of interest -------------------------------------------------
# Extended HLA region on GRCh38 (chr6). We restrict all steps to this
# interval (via -L) to keep compute demo-sized instead of full WGS.
region:
  name: "HLA_extended"
  contig: "chr6"
  start: 28510120
  end: 33480577
  bed: "resources/regions/hla_extended.bed"   # generated by scripts/make_region_bed.sh

# ---- Reference & known-sites resources -----------------------------------
reference:
  fasta: "resources/reference/GRCh38_full_analysis_set_plus_decoy_hla.fa"
  dbsnp: "resources/reference/dbsnp_146.hg38.vcf.gz"
  mills_indels: "resources/reference/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz"

# ---- GIAB truth sets (ground truth for benchmarking) ----------------------
# NOTE: there is no African GIAB truth sample. HG001 is European (Ashkenazi
# trio HG002-004 also used as "European-adjacent"), HG005-007 are Han
# Chinese. AFR and SAS samples in this project have NO matched truth set —
# call that out explicitly in the write-up as part of the reference-bias
# finding itself.
giab:
  HG001:
    truth_vcf: "resources/giab/HG001_GRCh38_1_22_v4.2.1_benchmark.vcf.gz"
    confident_bed: "resources/giab/HG001_GRCh38_1_22_v4.2.1_benchmark_noinconsistent.bed"
    ancestry: EUR
  HG002:
    truth_vcf: "resources/giab/HG002_GRCh38_1_22_v4.2.1_benchmark.vcf.gz"
    confident_bed: "resources/giab/HG002_GRCh38_1_22_v4.2.1_benchmark_noinconsistent.bed"
    ancestry: AJ_EUR_proxy
  HG005:
    truth_vcf: "resources/giab/HG005_GRCh38_1_22_v4.2.1_benchmark.vcf.gz"
    confident_bed: "resources/giab/HG005_GRCh38_1_22_v4.2.1_benchmark_noinconsistent.bed"
    ancestry: EAS

# ---- Sample cohort ---------------------------------------------------------
# Full list lives in samples.tsv (sample, ancestry, source_cram_url).
# Ancestry superpopulation codes follow 1000 Genomes: AFR, EUR, SAS, EAS, AMR.
sample_sheet: "samples.tsv"

ancestry_groups:
  - AFR
  - EUR
  - SAS
  - EAS

# ---- Tool parameters ---------------------------------------------------
fastp:
  extra: "--detect_adapter_for_pe --qualified_quality_phred 20"

bwa:
  threads: 4

gatk:
  haplotypecaller_extra: "-ERC GVCF"
  java_opts: "-Xmx8g"

# GATK documented hard-filter defaults (used instead of VQSR — VQSR needs a
# larger cohort than this demo has).
hard_filters:
  snp:
    QD: "QD < 2.0"
    FS: "FS > 60.0"
    MQ: "MQ < 40.0"
    MQRankSum: "MQRankSum < -12.5"
    ReadPosRankSum: "ReadPosRankSum < -8.0"
    SOR: "SOR > 3.0"
  indel:
    QD: "QD < 2.0"
    FS: "FS > 200.0"
    ReadPosRankSum: "ReadPosRankSum < -20.0"
    SOR: "SOR > 10.0"

# ---- Benchmarking (hap.py) ------------------------------------------------
happy:
  stratification_beds:
    - "resources/giab/stratification/LowComplexity.bed.gz"
    - "resources/giab/stratification/SegmentalDuplications.bed.gz"

# ---- Paths ---------------------------------------------------------------
paths:
  resources: "resources"
  results: "results"
  logs: "logs"
  benchmarks: "benchmarks"

# ---- AWS (used only by aws/ scripts, not by Snakemake directly) ----------
aws:
  region: "us-east-1"
  s3_bucket: "CHANGE-ME-hla-pipeline-<your-aws-account-id>"
  batch_job_queue: "hla-pipeline-queue"
  batch_job_definition: "hla-pipeline-jobdef"
  ecr_repo: "hla-pipeline"
