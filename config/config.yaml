# Main config for the HLA multi-ancestry pipeline.
# The sample lists are in samples.tsv and giab_samples.tsv.

# ---- Region ----
# Extended HLA region on GRCh38 (chr6). Every step is limited to this interval
# with -L, so the run stays small compared with whole-genome data.
region:
  name: "HLA_extended"
  contig: "chr6"
  start: 28510120
  end: 33480577
  bed: "resources/regions/hla_extended.bed"   # made by scripts/make_region_bed.sh

# ---- Reference and known sites ----
# fasta: Broad's hg38 reference with the 261 *_alt contigs removed
#   (scripts/make_no_alt_reference.sh). With the alt contigs left in, reads in the
#   HLA region got mapping quality 0 and GATK ignored them.
# dbsnp: dbSNP build 138, bgzip-compressed and tabix-indexed.
reference:
  fasta: "resources/reference/GRCh38_no_alt_plus_decoy_hla.fa"
  dbsnp: "resources/reference/dbsnp_138.hg38.vcf.gz"
  mills_indels: "resources/reference/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz"

# ---- GIAB truth sets ----
# HG001 is European, HG002 is Ashkenazi Jewish (used only as a European-adjacent
# stand-in) and HG005 is Han Chinese. GIAB has no African or South Asian sample,
# so the AFR and SAS cohort samples have no truth set.
giab:
  HG001:
    truth_vcf: "resources/giab/HG001_GRCh38_1_22_v4.2.1_benchmark.vcf.gz"
    confident_bed: "resources/giab/HG001_GRCh38_1_22_v4.2.1_benchmark_noinconsistent.bed"
    ancestry: EUR
  HG002:
    truth_vcf: "resources/giab/HG002_GRCh38_1_22_v4.2.1_benchmark.vcf.gz"
    confident_bed: "resources/giab/HG002_GRCh38_1_22_v4.2.1_benchmark_noinconsistent.bed"
    ancestry: AJ_EUR_proxy
  HG005:
    truth_vcf: "resources/giab/HG005_GRCh38_1_22_v4.2.1_benchmark.vcf.gz"
    confident_bed: "resources/giab/HG005_GRCh38_1_22_v4.2.1_benchmark_noinconsistent.bed"
    ancestry: EAS

# ---- Cohort ----
# Samples are listed in samples.tsv (sample, ancestry, population, sex, CRAM URL).
# Ancestry codes follow 1000 Genomes: AFR, EUR, SAS, EAS.
sample_sheet: "samples.tsv"

ancestry_groups:
  - AFR
  - EUR
  - SAS
  - EAS

# ---- Tool settings ----
fastp:
  extra: "--detect_adapter_for_pe --qualified_quality_phred 20"

bwa:
  threads: 4

gatk:
  haplotypecaller_extra: "-ERC GVCF"
  java_opts: "-Xmx3g"

# GATK's documented hard-filter thresholds. I used these instead of VQSR because
# 15 samples is too few to train it.
hard_filters:
  snp:
    QD: "QD < 2.0"
    FS: "FS > 60.0"
    MQ: "MQ < 40.0"
    MQRankSum: "MQRankSum < -12.5"
    ReadPosRankSum: "ReadPosRankSum < -8.0"
    SOR: "SOR > 3.0"
  indel:
    QD: "QD < 2.0"
    FS: "FS > 200.0"
    ReadPosRankSum: "ReadPosRankSum < -20.0"
    SOR: "SOR > 10.0"

# ---- hap.py ----
# hap.py takes one TSV listing the stratification BED files, not a list of BEDs.
# scripts/download_giab.sh writes it.
happy:
  stratification_beds:
    - "resources/giab/stratification/strat.tsv"

# ---- Paths ----
paths:
  resources: "resources"
  results: "results"
  logs: "logs"
  benchmarks: "benchmarks"

# ---- AWS (only used by the scripts in aws/ and docker/) ----
aws:
  region: "us-east-1"
  s3_bucket: "hla-pipeline-874186497878"
  batch_job_queue: "hla-pipeline-queue"
  batch_job_definition: "hla-pipeline-jobdef"
  ecr_repo: "hla-pipeline"
