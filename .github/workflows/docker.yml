name: Build Docker image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docker/**"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/gautami1412/hla-pipeline:latest
            874186497878.dkr.ecr.us-east-1.amazonaws.com/hla-pipeline:latest
      - name: Check the tools work
        run: |
          docker run --rm ghcr.io/gautami1412/hla-pipeline:latest snakemake --version
          docker run --rm ghcr.io/gautami1412/hla-pipeline:latest gatk --version
          docker run --rm ghcr.io/gautami1412/hla-pipeline:latest hap.py --version
